# How `stick svc` drives this service. ${VAR:-default} is expanded from the environment,
# using the same variables and defaults as compose.yaml.
name: netbox
description: NetBox 4.7 source of truth (DCIM/IPAM)
compose: compose.yaml
project: stick-netbox
wait_timeout_s: 720  # first boot runs migrations: ~150 s on a desktop, 5-6 min on a 4-vCPU CI runner

health:
  url: http://127.0.0.1:${STICK_NETBOX_PORT:-8081}/api/status/
  headers:
    Authorization: Bearer nbt_${STICK_NETBOX_TOKEN_KEY:-stickadmin01}.${STICK_NETBOX_TOKEN:-0123456789abcdef0123456789abcdef01234567}

endpoints:
  web (host): http://127.0.0.1:${STICK_NETBOX_PORT:-8081}
  api (lab mgmt network): http://172.30.30.100:8080/api/

credentials:
  username: ${STICK_NETBOX_USER:-admin}
  password: ${STICK_NETBOX_PASSWORD:-admin}
  api_token (Bearer): nbt_${STICK_NETBOX_TOKEN_KEY:-stickadmin01}.${STICK_NETBOX_TOKEN:-0123456789abcdef0123456789abcdef01234567}

seed:
  kind: netbox-rest
  file: seed.yaml
  base_url: http://127.0.0.1:${STICK_NETBOX_PORT:-8081}/api/
  headers:
    Authorization: Bearer nbt_${STICK_NETBOX_TOKEN_KEY:-stickadmin01}.${STICK_NETBOX_TOKEN:-0123456789abcdef0123456789abcdef01234567}

snapshot:
  kind: postgres
  service: postgres
  database: netbox
  user: netbox
  path: /snapshots/seed.dump
  stop: [netbox, netbox-worker]
  after_restore:
    - service: valkey
      cmd: [sh, -c, 'valkey-cli --pass "$REDIS_PASSWORD" --no-auth-warning FLUSHALL']

# The mcp section: NetBox Labs' server. Read-only by design: four tools, which take NetBox object types
# ("dcim.device") and API filters.
mcp:
  server: netbox
  version: 1.2.2
  env:
    NETBOX_URL: http://127.0.0.1:${STICK_NETBOX_PORT:-8081}
    NETBOX_TOKEN: nbt_${STICK_NETBOX_TOKEN_KEY:-stickadmin01}.${STICK_NETBOX_TOKEN:-0123456789abcdef0123456789abcdef01234567}
    LOG_LEVEL: WARNING
