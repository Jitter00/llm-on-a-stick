# moto for llm-on-a-stick: an emulated AWS API (EC2, IAM, S3...) for the aws and terraform sections.
# It keeps everything in memory and enforces nothing (no packets, no IAM): tasks are graded on resource state.
# Start it with `stick svc up moto`; it doesn't need the lab.
name: stick-moto

services:
  moto:
    image: docker.io/motoserver/moto:5.2.5
    ports:
      - "127.0.0.1:${STICK_MOTO_PORT:-8083}:5000"
    networks:
      stick-mgmt:
        ipv4_address: 172.30.30.103
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:5000/moto-api/')"]
      interval: 2s
      timeout: 3s
      retries: 30

networks:
  stick-mgmt:
    external: true
