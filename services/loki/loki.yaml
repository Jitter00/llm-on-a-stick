# One Loki process, chunks and index on the local disk, no authentication: a lab of four routers.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# Ready as soon as it is: a reset before every attempt should take seconds.
ingester:
  lifecycler:
    min_ready_duration: 0s
    final_sleep: 0s

# The query workers look for their scheduler every 10 s by default: that would be the whole start-up time.
frontend_worker:
  dns_lookup_duration: 1s
frontend:
  scheduler_dns_lookup_period: 1s

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # The routers' clocks are the host's; nothing arrives late.
  reject_old_samples: false
  volume_enabled: true

pattern_ingester:
  enabled: true
  lifecycler:
    min_ready_duration: 0s
    final_sleep: 0s

analytics:
  reporting_enabled: false
