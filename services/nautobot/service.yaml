# How `stick svc` drives this service. ${VAR:-default} is expanded from the environment,
# using the same variables and defaults as compose.yaml.
name: nautobot
description: Nautobot 3.2 source of truth (DCIM/IPAM, REST and GraphQL)
compose: compose.yaml
project: stick-nautobot
wait_timeout_s: 720  # first boot runs migrations: ~2.5 min on a desktop; every start runs post_upgrade (~20 s)

health:
  url: http://127.0.0.1:${STICK_NAUTOBOT_PORT:-8082}/api/status/
  headers:
    Authorization: Token ${STICK_NAUTOBOT_TOKEN:-0123456789abcdef0123456789abcdef01234567}

endpoints:
  web (host): http://127.0.0.1:${STICK_NAUTOBOT_PORT:-8082}
  api (lab mgmt network): http://172.30.30.102:8080/api/
  graphql (lab mgmt network): http://172.30.30.102:8080/api/graphql/

credentials:
  username: ${STICK_NAUTOBOT_USER:-admin}
  password: ${STICK_NAUTOBOT_PASSWORD:-admin}
  api_token (Token): ${STICK_NAUTOBOT_TOKEN:-0123456789abcdef0123456789abcdef01234567}

seed:
  kind: rest
  file: seed.yaml
  base_url: http://127.0.0.1:${STICK_NAUTOBOT_PORT:-8082}/api/
  headers:
    Authorization: Token ${STICK_NAUTOBOT_TOKEN:-0123456789abcdef0123456789abcdef01234567}

snapshot:
  kind: postgres
  service: postgres
  database: nautobot
  user: nautobot
  path: /snapshots/seed.dump
  stop: [nautobot]
  after_restore:
    - service: redis
      cmd: [sh, -c, 'valkey-cli --pass "$REDIS_PASSWORD" --no-auth-warning FLUSHALL']

# The mcp section: the community server nautobot-mcp. Its tools can change Nautobot only with
# NAUTOBOT_MCP_ALLOW_WRITES. 28 of its 77 tools are offered: the inventory and IPAM ones and the generic REST
# and GraphQL ones (not circuits, virtualisation, jobs, users, webhooks...).
mcp:
  server: nautobot
  version: 0.2.5
  env:
    NAUTOBOT_URL: http://127.0.0.1:${STICK_NAUTOBOT_PORT:-8082}
    NAUTOBOT_TOKEN: ${STICK_NAUTOBOT_TOKEN:-0123456789abcdef0123456789abcdef01234567}
    NAUTOBOT_MCP_ALLOW_WRITES: "true"
  allow:
    - list_endpoints_in
    - list_content_types
    - rest_list
    - rest_get
    - rest_create
    - rest_update
    - rest_delete
    - graphql_query
    - list_devices
    - get_device
    - get_device_interfaces
    - list_locations
    - list_namespaces
    - list_prefixes
    - get_prefix
    - get_available_prefixes
    - get_available_ips
    - list_ip_addresses
    - get_ip_address
    - list_vlans
    - list_vrfs
    - list_tenants
    - list_statuses
    - list_roles
    - list_tags
    - search_devices
    - search_prefixes
    - search_ip_addresses
