[project]
name = "llm-on-a-stick"
version = "0.1.0"
description = "One eval harness, many LLMs. Start poking. An agentic NetOps benchmark for local and frontier LLMs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["llm", "evaluation", "benchmark", "network-automation", "containerlab", "netdevops", "agents"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.28",
    "rich>=15.0",
    "pyyaml>=6.0.3",
    "pydantic>=2.14",
    "psutil>=7.2",
    "jsonschema>=4.26",
]

[project.scripts]
stick = "llm_on_a_stick.cli:app"
llm-on-a-stick = "llm_on_a_stick.cli:app"

[project.urls]
Repository = "https://github.com/Jitter00/llm-on-a-stick"
Issues = "https://github.com/Jitter00/llm-on-a-stick/issues"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "mypy>=2.4",
    "ruff>=0.17.4",
    "types-PyYAML>=6.0.12",
    "types-psutil>=7.2",
    "types-jsonschema",
    "pre-commit>=4.7",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.8",
]

[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_on_a_stick"]

# Lab assets live at the repo root for readability; ship them inside the wheel too.
[tool.hatch.build.targets.wheel.force-include]
"topologies" = "llm_on_a_stick/_assets/topologies"
"configs" = "llm_on_a_stick/_assets/configs"
"images" = "llm_on_a_stick/_assets/images"
"sections" = "llm_on_a_stick/_assets/sections"
"services" = "llm_on_a_stick/_assets/services"

[tool.hatch.build.targets.sdist]
include = ["src", "topologies", "configs", "images", "sections", "services", "docs", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH", "S"]
ignore = ["S603", "S607"]  # we deliberately shell out to docker/containerlab with fixed argv lists

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not lab'"
markers = [
    "lab: needs Docker + containerlab and deploys the base lab (run with -m lab)",
]

[tool.coverage.run]
source = ["llm_on_a_stick"]
branch = true
