version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly}
    commit-message: {prefix: "chore", include: scope}
    # One PR a week: separate PRs all change uv.lock, so each merge makes the others rebase and rerun CI.
    groups:
      python: {patterns: ["*"]}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    commit-message: {prefix: "ci"}
    groups:
      actions: {patterns: ["*"]}
  - package-ecosystem: docker
    directory: /images/frr
    schedule: {interval: weekly}
    commit-message: {prefix: "chore", include: scope}
