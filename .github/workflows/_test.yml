# Reusable unit-test stage. Pushes run Linux + one Python; PRs run the full OS x Python matrix.
name: test

on:
  workflow_call:
    inputs:
      full-matrix:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-26 is Apple Silicon (= macos-latest). One extra Intel Mac job: Intel is a shrinking minority
        # (macOS 26 is the last release supporting it) and the CLI is almost architecture-independent.
        os: ${{ fromJSON(inputs.full-matrix && '["ubuntu-24.04","macos-26","windows-2025"]' || '["ubuntu-24.04"]') }}
        python: ${{ fromJSON(inputs.full-matrix && '["3.11","3.12","3.13"]' || '["3.12"]') }}
        include: ${{ fromJSON(inputs.full-matrix && '[{"os":"macos-15-intel","python":"3.12"}]' || '[]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Runner platform
        run: uv run python -c "import platform, sys; print(platform.system(), platform.machine(), sys.version)"
      - run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      - if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage
          path: coverage.xml
