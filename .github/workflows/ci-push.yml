# Push to any branch except main: lint -> test (fast unit tests, no Docker).
# Not on release-please's branch: its Release PR runs ci-pr, which covers the same and more.
name: ci-push

on:
  push:
    branches-ignore: [main, "release-please--**"]

concurrency:
  group: ci-push-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/_lint.yml
  test:
    needs: lint
    uses: ./.github/workflows/_test.yml
    with:
      full-matrix: false
