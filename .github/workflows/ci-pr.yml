# Pull request to main: lint -> test (unit matrix + integration lab) -> build -> release (dry run) -> deploy preview.
# Nothing is published from a PR; the real release/deploy happens in release.yml after merge.
# A release-please Release PR that only bumps the version and the changelog gets a reduced run (one unit job,
# no lab, no multi-arch image): main's code was already fully tested by the PRs that merged it, because
# branch protection requires them to be up to date with main. See .github/scripts/release-only.sh.
name: ci-pr

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CONTAINERLAB_VERSION: "0.82.0"

jobs:
  pr-title:
    name: semantic PR title
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      # Squash merge uses the PR title as the commit on main, so it must be a Conventional Commit.
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6  # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  scope:
    name: release-only?
    runs-on: ubuntu-24.04
    outputs:
      release-only: ${{ steps.check.outputs.release-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - id: check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
        run: |
          result=$(.github/scripts/release-only.sh "$BASE" "$HEAD" "$BRANCH")
          echo "release-only=$result" >> "$GITHUB_OUTPUT"
          echo "Release-only PR (reduced CI): $result" >> "$GITHUB_STEP_SUMMARY"

  lint:
    uses: ./.github/workflows/_lint.yml

  test:
    needs: [lint, scope]
    uses: ./.github/workflows/_test.yml
    with:
      full-matrix: ${{ needs.scope.outputs.release-only != 'true' }}

  integration:
    name: integration (base lab)
    needs: [lint, scope]
    if: needs.scope.outputs.release-only != 'true'
    runs-on: ubuntu-24.04
    # Only the lab tests this PR needs (llm_on_a_stick.labselect): the sections it touches, plus each section's
    # floor task when shared code changes. The worst case is shared code plus one section (~30 min).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the selection diffs the PR against its base
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Select the lab tests this PR needs
        id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          uv run python -m llm_on_a_stick.labselect "$BASE" "$HEAD" 2> >(tee -a "$GITHUB_STEP_SUMMARY" >&2) > selection
          grep '^STICK_LAB_' selection >> "$GITHUB_ENV"
          grep '^run=' selection >> "$GITHUB_OUTPUT"
          cat selection
      - name: Install containerlab
        if: steps.select.outputs.run == 'true'
        run: bash -c "$(curl -sL https://get.containerlab.dev)" -- --version "$CONTAINERLAB_VERSION"
      - name: Install sshpass (the NETCONF task oracles use it)
        if: steps.select.outputs.run == 'true'
        run: sudo apt-get install -y --no-install-recommends sshpass
      - name: Build stick-frr
        if: steps.select.outputs.run == 'true'
        run: uv run stick image build frr
      - name: Build stick-toolbox (where models' commands run)
        if: steps.select.outputs.run == 'true'
        run: uv run stick image build toolbox
      - name: stick doctor
        if: steps.select.outputs.run == 'true'
        run: uv run stick doctor
      - name: Deploy base lab and run the selected lab tests
        if: steps.select.outputs.run == 'true'
        # containerlab needs root on the runner; keep the uv environment (and the STICK_LAB_* selection).
        run: sudo -E env "PATH=$PATH" uv run pytest -m lab -v
      - name: Task lint
        run: uv run stick task lint
      - name: Dump lab state on failure
        if: failure()
        run: |
          docker ps -a
          for c in $(docker ps -a --format '{{.Names}}' | grep '^clab-'); do echo "== $c"; docker logs --tail 50 "$c"; done

  build:
    needs: [scope, test, integration]
    # integration is skipped on release-only PRs; build still has to run then.
    if: >-
      always() && needs.scope.result == 'success' && needs.test.result == 'success'
      && (needs.integration.result == 'success'
          || (needs.integration.result == 'skipped' && needs.scope.outputs.release-only == 'true'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Build wheel and sdist
        run: uv build
      - name: Check the wheel ships the lab assets
        run: |
          unzip -l dist/*.whl | grep -q '_assets/topologies/base.clab.yml'
          unzip -l dist/*.whl | grep -q '_assets/images/frr/Dockerfile'
          unzip -l dist/*.whl | grep -q '_assets/images/toolbox/Dockerfile'
          unzip -l dist/*.whl | grep -q 'llm_on_a_stick/data/prices.yaml'
          unzip -l dist/*.whl | grep -q 'llm_on_a_stick/data/sampling.yaml'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
      # The FRR image can't change in a release-only PR: skip the multi-arch build there.
      - if: needs.scope.outputs.release-only != 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - if: needs.scope.outputs.release-only != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build stick-frr (amd64 + arm64, not pushed)
        if: needs.scope.outputs.release-only != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: images/frr
          platforms: linux/amd64,linux/arm64
          push: false
          tags: stick-frr:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-dry-run:
    name: release (dry run)
    needs: build
    # Explicit: the default success() also needs build's own needs, and integration is skipped on purpose
    # in a release-only PR.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: What would release-please do on main?
        run: >
          npx --yes release-please@17.11.2 release-pr
          --dry-run
          --token "${{ secrets.GITHUB_TOKEN }}"
          --repo-url "${{ github.repository }}"
          --target-branch "${{ github.base_ref }}"
      - name: Version bump this PR adds
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Mirrors release-please-config.json: bump-minor-pre-major=true, so breaking changes bump minor before 1.0.
          if [[ "$TITLE" =~ ^[a-z]+(\(.+\))?!: ]]; then bump="major (minor while < 1.0)";
          elif [[ "$TITLE" =~ ^feat ]]; then bump="minor";
          elif [[ "$TITLE" =~ ^(fix|perf) ]]; then bump="patch";
          else bump="none (no release)"; fi
          echo "PR title: $TITLE" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Expected bump once merged: $bump" | tee -a "$GITHUB_STEP_SUMMARY"

  deploy-preview:
    name: deploy preview (docs)
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}  # see release-dry-run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --locked --group docs
      - run: uv run mkdocs build --strict
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: docs-preview
          path: site/

  # The only check branch protection requires. Jobs can be added, renamed or re-matrixed without
  # touching branch protection. GitHub treats a *skipped* required check as passing, so this gate
  # fails on skipped dependencies itself, except integration on a release-only PR (skipped on purpose).
  ci-ok:
    name: ci-ok
    if: always()
    needs: [scope, pr-title, lint, test, integration, build, release-dry-run, deploy-preview]
    runs-on: ubuntu-24.04
    steps:
      - name: All required jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          RELEASE_ONLY: ${{ needs.scope.outputs.release-only }}
        run: |
          echo "release-only: $RELEASE_ONLY"
          bad=$(jq -r --arg ro "$RELEASE_ONLY" 'to_entries[]
            | select(.value.result != "success")
            | select(($ro == "true" and .key == "integration" and .value.result == "skipped") | not)
            | "\(.key): \(.value.result)"' <<<"$NEEDS")
          if [[ -n "$bad" ]]; then
            echo "::error::required jobs did not succeed: $(tr '\n' ' ' <<<"$bad")"
            exit 1
          fi
          echo "all required jobs succeeded"
