# Base lab: 2x Nokia SR Linux spines, 2x FRR leaves, 2x Linux hosts. No vendor accounts needed.
#
#        srl1 (AS65001)      srl2 (AS65002)
#          |      \          /      |
#          |       \        /       |
#        frr1 (AS65101)    frr2 (AS65102)
#          |                        |
#          h1 10.1.1.10/24          h2 10.1.2.10/24
#
# Point-to-point links are /31s in 10.0.<spine>.0/24; loopbacks in 10.255.0.0/24.
# eBGP everywhere; leaves redistribute their connected host subnets.
# Each node carries a `stick-os` label (srlinux | frr | host) that the grader uses to read its state.
name: stick-base

mgmt:
  network: stick-mgmt            # the tool stack (NetBox, Oxidized, ...) joins this network later
  ipv4-subnet: 172.30.30.0/24

topology:
  kinds:
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux:26.7.2
      type: ixr-d2l
    linux:
      image: ${STICK_FRR_IMAGE:=stick-frr:dev}

  nodes:
    srl1:
      labels: {stick-os: srlinux}
      kind: nokia_srlinux
      mgmt-ipv4: 172.30.30.11
      startup-config: ../configs/srl/srl1.cli
    srl2:
      labels: {stick-os: srlinux}
      kind: nokia_srlinux
      mgmt-ipv4: 172.30.30.12
      startup-config: ../configs/srl/srl2.cli

    frr1:
      labels: {stick-os: frr}
      kind: linux
      mgmt-ipv4: 172.30.30.21
      binds:
        - ../configs/frr/frr1/frr.conf:/etc/stick/frr.conf:ro
        - ../configs/frr/daemons:/etc/stick/daemons:ro
    frr2:
      labels: {stick-os: frr}
      kind: linux
      mgmt-ipv4: 172.30.30.22
      binds:
        - ../configs/frr/frr2/frr.conf:/etc/stick/frr.conf:ro
        - ../configs/frr/daemons:/etc/stick/daemons:ro

    h1:
      labels: {stick-os: host}
      kind: linux
      image: ghcr.io/hellt/network-multitool@sha256:a8d96c19e593e227d7b16d320a04256ba00434028f0adb9f7da206bf098c7140
      mgmt-ipv4: 172.30.30.31
      exec:
        - ip addr add 10.1.1.10/24 dev eth1
        - ip route replace 10.0.0.0/8 via 10.1.1.1
    h2:
      labels: {stick-os: host}
      kind: linux
      image: ghcr.io/hellt/network-multitool@sha256:a8d96c19e593e227d7b16d320a04256ba00434028f0adb9f7da206bf098c7140
      mgmt-ipv4: 172.30.30.32
      exec:
        - ip addr add 10.1.2.10/24 dev eth1
        - ip route replace 10.0.0.0/8 via 10.1.2.1

  links:
    - endpoints: ["srl1:e1-1", "frr1:eth1"]   # 10.0.1.0/31
    - endpoints: ["srl1:e1-2", "frr2:eth1"]   # 10.0.1.2/31
    - endpoints: ["srl2:e1-1", "frr1:eth2"]   # 10.0.2.0/31
    - endpoints: ["srl2:e1-2", "frr2:eth2"]   # 10.0.2.2/31
    - endpoints: ["frr1:eth3", "h1:eth1"]     # 10.1.1.0/24
    - endpoints: ["frr2:eth3", "h2:eth1"]     # 10.1.2.0/24
