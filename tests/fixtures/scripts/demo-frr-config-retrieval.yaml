# A scripted "model" for `stick run --model script/<this file>`: the commands a correct agent runs.
# Used by the lab test to prove the runner, the toolbox and the task work together.
commands:
  - sshpass -p admin ssh admin@{{ nodes.frr1.mgmt_ip }} "show running-config" > {{ workspace }}/frr1.cfg
  - wc -l {{ workspace }}/frr1.cfg
final: Saved frr1's running config.
