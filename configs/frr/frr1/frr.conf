frr version 10.7
frr defaults datacenter
hostname frr1
log syslog informational
service integrated-vtysh-config
!
interface eth1
 description to srl1
 ip address 10.0.1.1/31
exit
!
interface eth2
 description to srl2
 ip address 10.0.2.1/31
exit
!
interface eth3
 description to h1
 ip address 10.1.1.1/24
exit
!
interface lo
 ip address 10.255.0.11/32
exit
!
! use-underlays-nexthop-weight is a default FRR shows anyway; listing it keeps frr-reload stable
! (stick task start restores this file with frr-reload).
router bgp 65101
 bgp router-id 10.255.0.11
 bgp bestpath as-path multipath-relax
 neighbor 10.0.1.0 remote-as 65001
 neighbor 10.0.1.0 description srl1
 neighbor 10.0.2.0 remote-as 65002
 neighbor 10.0.2.0 description srl2
 use-underlays-nexthop-weight
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
exit
!
