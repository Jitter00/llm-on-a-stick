id: suzieq-find-address
section: suzieq
title: Find where an address's network is attached and which spine frr1 reaches it through, from SuzieQ
tier: intermediate
tags: [tool:suzieq, vendor:frr, iface:mcp, skill:state-query, skill:routing]
prompt: |
  SuzieQ polls the lab's two FRR routers, frr1 and frr2, and keeps what it reads: interfaces, routes, BGP
  sessions, LLDP neighbours and more. You reach its REST API through an MCP server; its namespace is "lab".
  The two SR Linux routers (srl1, srl2) are not polled. frr1 and frr2 are leaves; srl1 and srl2 are the spines
  between them.

  A monitoring alert names the host {{ canaries.net }}.57. No router has that address itself: it is a host on a
  network that one of the routers has on an interface. Find which router and interface that network is
  configured on, and through which spine or spines frr1 sends traffic to the host now. Submit with
  submit_answer:
    {"router": "<frr1 or frr2>", "interface": "<interface name>", "frr1_via": ["<srl1 and/or srl2>"]}
requires:
  devices: [srl1, srl2, frr1, frr2]
  services: [suzieq]
tools:
  mcp: [suzieq]
reset_services: [suzieq]
canaries:
  net: net24
setup: setup.sh
oracle: oracle.sh
checks:
  - type: json_file_matches
    name: the answer names the router and interface the network is attached to
    params:
      path: answer.json
      expected: {router: frr2, interface: eth3}
  - type: json_file_matches
    name: the answer names the one spine frr1 reaches it through
    params:
      path: answer.json
      expected: {frr1_via: [srl2]}
  - type: no_change_outside
    name: no router was changed
    params: {allowed: []}
  - type: llm_judge
    name: how it put the tables together
    params:
      artifact: transcript
      rubric: |
        Judge how the candidate went about the task, not whether the end result is right (code checks that).
        5: worked out that the host is not an interface address, found frr1's route to it by longest match
           (route lpm, or the routes that contain it, taking the most specific one), found where that network
           is connected, and turned the route's next hops or outgoing interfaces into spine names with data it
           read (LLDP neighbours, or the next hops' addresses on the links), without assuming both spines
           carry it.
        3: got to an answer, but went through frr1's own broader network first, or assumed the spine from
           the route being "learnt over BGP", or read whole tables
           where a filter would do, or needed several failed calls on the way.
        1: guessed or invented the router, the interface or the spines instead of reading them; or kept
           repeating calls that had already failed without changing approach.
        Use 2 and 4 for attempts in between.
limits: {turns: 20}
