id: nautobot-query-interface
section: nautobot
title: Find an interface and its IP address in Nautobot
tier: basic
floor: true  # the section's cheap floor task: CI validates it on every shared-code change
tags: [tool:nautobot, iface:mcp, skill:sot-query]
prompt: |
  You reach Nautobot through its MCP server.

  In Nautobot, the device {{ canaries.device }} has one interface whose description is "{{ canaries.desc }}".
  Find that interface and the IPv4 address assigned to it, and give them with `submit_answer`:
    {"interface": "<interface name>", "address": "<address with prefix length, as Nautobot shows it>"}

  Do not change anything in Nautobot or on any device.
requires:
  services: [nautobot]
tools:
  mcp: [nautobot]
reset_services: [nautobot]
canaries:
  device: hostname
  desc: description
  addr: ipv4
setup: setup.sh
oracle: oracle.sh
checks:
  - type: json_file_matches
    name: answer.json names the interface and its address
    params:
      path: answer.json
      expected: {interface: eth2, address: "{{ canaries.addr }}/24"}
    weight: 2
  - type: nautobot_unchanged
    name: nothing was changed in Nautobot
    params: {allow_new: []}
  - type: no_change_outside
    name: no configuration was changed
    params: {allowed: []}
  - type: llm_judge
    name: how it looked the interface up
    params:
      artifact: transcript
      rubric: |
        Judge how the candidate went about the task, not whether the end result is right (code checks that).
        5: found the device by name, found its interface by the description (a filter, or the device's full
           interface list), read the address assigned to that interface from Nautobot, and submitted both as
           Nautobot shows them.
        3: got to an answer by reading long unfiltered lists, with several failed calls on the way, or took an
           address without checking it is assigned to that interface, or never submitted an answer.
        1: guessed or invented an interface, an address, an id or a filter instead of reading it; kept repeating
           calls that had already failed without changing approach; or changed something in Nautobot.
        Use 2 and 4 for attempts in between.
limits: {turns: 15}
