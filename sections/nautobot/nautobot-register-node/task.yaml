id: nautobot-register-node
section: nautobot
title: Document a router in Nautobot, with its interfaces and primary IP
tier: intermediate
tags: [tool:nautobot, vendor:frr, iface:rest, iface:cli, skill:sot-update]
prompt: |
  Nautobot is at {{ services.nautobot.url }} (REST API under /api/, header "Authorization: Token {{ services.nautobot.token }}").
  The router frr2 runs FRRouting; you can reach it over SSH at {{ nodes.frr2.mgmt_ip }} (user admin, password admin).

  frr2 is not in Nautobot yet. Document it:
    - a device named frr2: location stick-lab, role Leaf, device type "FRR container", platform FRR, status Active;
    - its interfaces eth0, eth1, eth2 and eth3, status Active, each with the description configured on the router
      (if any);
    - its management IPv4 address, with its prefix length, in the stick-lab namespace (where the lab's management
      prefix is), assigned to interface eth0 and set as the device's primary IPv4 address.

  Do not change anything else in Nautobot, and do not change any configuration on the router.
requires:
  devices: [frr2]
  services: [nautobot]
reset_services: [nautobot]
canaries:
  eth1_desc: description
  eth2_desc: description
setup: setup.sh
oracle: oracle.sh
checks:
  - type: nautobot_object
    name: frr2 exists with the right location, role, type, platform, status and primary IP
    params:
      endpoint: dcim/devices
      filters: {name: frr2}
      expect:
        location.name: stick-lab
        role.name: Leaf
        device_type.model: FRR container
        platform.name: FRR
        status.name: Active
        primary_ip4.address: "{{ nodes.frr2.mgmt_ip }}/24"
    weight: 2
  - type: nautobot_object
    name: eth1 has the router's description
    params:
      endpoint: dcim/interfaces
      filters: {device: frr2, name: eth1}
      expect: {description: "{{ canaries.eth1_desc }}"}
  - type: nautobot_object
    name: eth2 has the router's description
    params:
      endpoint: dcim/interfaces
      filters: {device: frr2, name: eth2}
      expect: {description: "{{ canaries.eth2_desc }}"}
  - type: nautobot_object
    name: frr2 has interfaces eth0-eth3
    params: {endpoint: dcim/interfaces, filters: {device: frr2}, count: 4}
  - type: nautobot_object
    name: the management address is in the lab's management prefix and assigned to eth0
    params:
      endpoint: ipam/ip-addresses
      filters: {address: "{{ nodes.frr2.mgmt_ip }}/24", device: frr2, interfaces: eth0}
      expect: {parent.prefix: 172.30.30.0/24}
  - type: nautobot_unchanged
    name: nothing else was changed in Nautobot
    params: {allow_new: [dcim/devices, dcim/interfaces, ipam/ip-addresses, ipam/ip-address-to-interface]}
  - type: no_change_outside
    name: no configuration was changed
    params: {allowed: []}
limits: {turns: 30}
