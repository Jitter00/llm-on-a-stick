id: nautobot-carve-prefix
section: nautobot
title: Reserve the first free /28 of a prefix
tier: intermediate
tags: [tool:nautobot, iface:mcp, skill:ipam-allocation]
prompt: |
  You reach Nautobot through its MCP server.

  In the namespace stick-lab, the prefix {{ canaries.pool }}.0/24 is handed out to customers in /28 blocks.
  Reserve the first free /28 of it (the one with the lowest address): create that prefix in the same
  namespace, with the status Reserved, the type network and the description "{{ canaries.desc }}".

  Create that one prefix only, and do not change anything else in Nautobot.
topology: none
requires:
  services: [nautobot]
tools:
  mcp: [nautobot]
reset_services: [nautobot]
canaries:
  pool: net24
  desc: description
setup: setup.sh
oracle: oracle.sh
checks:
  - type: nautobot_object
    name: the first free /28 is reserved in the stick-lab namespace
    params:
      endpoint: ipam/prefixes
      filters: {prefix: "{{ canaries.pool }}.32/28", namespace: stick-lab}
      expect: {status.name: Reserved, type: network, description: "{{ canaries.desc }}"}
    weight: 3
  - type: nautobot_object
    name: only one prefix was created
    params:
      endpoint: ipam/prefixes
      filters: {q: "{{ canaries.desc }}"}
      count: 1
  - type: nautobot_unchanged
    name: nothing else was changed in Nautobot
    params: {allow_new: [ipam/prefixes]}
  - type: llm_judge
    name: how it chose and reserved the block
    params:
      artifact: transcript
      rubric: |
        Judge how the candidate went about the task, not whether the end result is right (code checks that).
        5: found the /24 in the stick-lab namespace, read every prefix that already exists inside it (all of
           them, in that namespace), worked out the lowest free /28 from that, looked up the ids it needed
           (namespace, status), created the one prefix with the fields asked for, and read it back.
        3: created the prefix after a first choice was refused or after several failed calls, or read the
           existing prefixes only in part (one page, the wrong namespace) before choosing, or never read back
           what it created.
        1: picked a block without reading what exists, invented ids for the namespace or the status, created
           more than one prefix or changed existing ones; or kept repeating calls that had already failed
           without changing approach.
        Use 2 and 4 for attempts in between.
limits: {turns: 20}
