# The task's reference steps as MCP calls: stick run nautobot-carve-prefix --model script/<this file>
steps:
  - tool: nautobot__list_prefixes
    args:
      filters: {prefix: "{{ canaries.pool }}.0/24", namespace: stick-lab}
    capture:
      parent: '"id":\s*"([0-9a-f-]{36})"'
  - tool: nautobot__get_available_prefixes
    args: {prefix_id: "{{ captured.parent }}"}
    capture:
      first: '"prefix":\s*"([0-9.]+)/\d+"'
  - tool: nautobot__rest_create
    args:
      endpoint: /api/ipam/prefixes/
      data:
        prefix: "{{ captured.first }}/28"
        namespace: {name: stick-lab}
        status: {name: Reserved}
        type: network
        description: "{{ canaries.desc }}"
