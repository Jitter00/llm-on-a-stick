id: telemetry-idle-ports
section: telemetry
title: Count a router's ports that are enabled but have no link, from streaming telemetry in Prometheus
tier: basic
floor: true  # the section's cheap floor task: CI validates it on every shared-code change
tags: [tool:prometheus, iface:mcp, skill:promql]
prompt: |
  srl1 and srl2 (Nokia SR Linux) stream telemetry over gNMI: the state and counters of their ports and of
  their BGP sessions. It is kept in Prometheus, which you reach through Grafana's MCP server. frr1 and frr2
  do not stream anything.

  Somebody enabled ports on srl2 that have nothing connected to them. Report, for srl2 as it is now, how many
  ports are enabled and up, and how many are enabled but down. Submit with submit_answer:
    {"router": "srl2", "enabled_and_up": <number>, "enabled_but_down": <number>}
requires:
  devices: [srl1, srl2, frr1, frr2, h1, h2]
  services: [loki, telemetry]
tools:
  mcp: [telemetry]
reset_services: [telemetry]
canaries:
  ports: count
setup: setup.sh
oracle: oracle.sh
checks:
  - type: json_file_matches
    name: the answer counts the enabled ports that are down
    params:
      path: answer.json
      expected:
        router: srl2
        enabled_but_down: "{{ canaries.ports }}"
    weight: 2
  - type: json_file_matches
    name: the answer counts the enabled ports that are up
    params:
      path: answer.json
      expected:
        enabled_and_up: 2
  - type: no_change_outside
    name: no configuration was changed
    params: {allowed: []}
  - type: llm_judge
    name: how it queried the telemetry
    params:
      artifact: transcript
      rubric: |
        Judge how the candidate went about the task, not whether the end result is right (code checks that).
        5: found the Prometheus datasource and the metric and label names for the ports' admin and oper state
           first, queried srl2's current values for both, and counted from what the queries returned (or had
           PromQL count), covering every port.
        3: got to counts after several failed or badly formed queries, or from one of the two states only with
           the other assumed, or by reading long unfiltered results, or never submitted an answer.
        1: guessed or invented a datasource id, a metric name, a label or the counts instead of reading them; or
           kept repeating calls that had already failed without changing approach.
        Use 2 and 4 for attempts in between.
limits: {turns: 15}
