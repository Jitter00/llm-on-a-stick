id: telemetry-session-drops
section: telemetry
title: Tell apart three reasons BGP sessions dropped, from the history in streaming telemetry
tier: advanced
tags: [tool:prometheus, iface:mcp, skill:promql, skill:correlation, skill:root-cause]
prompt: |
  srl1 and srl2 (Nokia SR Linux) stream telemetry over gNMI: the state and counters of their ports and of
  their BGP sessions. It is kept in Prometheus, which you reach through Grafana's MCP server. frr1 and frr2
  do not stream anything.

  In the last few minutes three BGP sessions on these two routers dropped and came back, each for a different
  reason, and everything is up again now:
  - one because somebody disabled the router's own port and enabled it again;
  - one because the link failed while the port stayed enabled;
  - one was reset several times with no port going down at all.
  Work out from the telemetry which is which and submit with submit_answer:
    {"port_disabled": {"router": "<router>", "interface": "<the port that was disabled>",
                       "neighbor": "<the neighbour address, as that router names it, of the session that dropped>"},
     "link_failed": {"router": "<router>", "interface": "<the port whose link failed>", "neighbor": "<address>"},
     "session_only": {"router": "<router>", "neighbor": "<address>",
                      "times": <how many times that session came back up in these minutes>}}
requires:
  devices: [srl1, srl2, frr1, frr2, h1, h2]
  services: [loki, telemetry]
tools:
  mcp: [telemetry]
reset_services: [telemetry]
canaries:
  resets: count
setup: setup.sh
oracle: oracle.sh
checks:
  - type: json_file_matches
    name: the answer names the port that was disabled and its session
    params:
      path: answer.json
      expected:
        port_disabled: {router: srl1, interface: ethernet-1/1, neighbor: 10.0.1.1}
  - type: json_file_matches
    name: the answer names the port whose link failed and its session
    params:
      path: answer.json
      expected:
        link_failed: {router: srl2, interface: ethernet-1/2, neighbor: 10.0.2.3}
  - type: json_file_matches
    name: the answer names the session that was reset and how often
    params:
      path: answer.json
      expected:
        session_only: {router: srl2, neighbor: 10.0.2.1, times: "{{ canaries.resets }}"}
    weight: 2
  - type: no_change_outside
    name: no configuration was changed
    params: {allowed: []}
limits: {turns: 30}
