id: netbox-cables-lldp
section: netbox
title: Add a router's cables to NetBox from LLDP
tier: intermediate
tags: [tool:netbox, vendor:srl, iface:rest, iface:cli, skill:discovery, skill:sot-update]
prompt: |
  NetBox is at {{ services.netbox.url }} (REST API under /api/, header "Authorization: Bearer {{ services.netbox.token }}").
  The router srl1 runs Nokia SR Linux; you can reach it over SSH at {{ nodes.srl1.mgmt_ip }} (user admin, password NokiaSrl1!).

  srl1 and its neighbours are in NetBox with their interfaces, but without cables. The neighbours announce
  themselves over LLDP with their NetBox device names. Using srl1's LLDP neighbours, add to NetBox a cable for
  every data link between srl1 and a neighbour. The management network is not a cable.

  Do not change anything else in NetBox, and do not change any configuration on any device.
requires:
  devices: [srl1, frr1, frr2]
  services: [netbox]
reset_services: [netbox]
canaries:
  n1: hostname
  n2: hostname
setup: setup.sh
oracle: oracle.sh
checks:
  - type: netbox_object
    name: srl1 ethernet-1/1 is cabled to the right neighbour's eth1
    params:
      endpoint: dcim/interfaces
      filters: {device: srl1, name: ethernet-1/1}
      expect: {link_peers.0.device.name: "{{ canaries.n1 }}", link_peers.0.name: eth1}
    weight: 2
  - type: netbox_object
    name: srl1 ethernet-1/2 is cabled to the right neighbour's eth1
    params:
      endpoint: dcim/interfaces
      filters: {device: srl1, name: ethernet-1/2}
      expect: {link_peers.0.device.name: "{{ canaries.n2 }}", link_peers.0.name: eth1}
    weight: 2
  - type: netbox_object
    name: no other cables (the management network is not one)
    params: {endpoint: dcim/cables, count: 2}
  - type: netbox_unchanged
    name: nothing else was changed in NetBox
    params: {allow_new: [dcim/cables]}
  - type: no_change_outside
    name: no configuration was changed
    params: {allowed: []}
limits: {turns: 25}
