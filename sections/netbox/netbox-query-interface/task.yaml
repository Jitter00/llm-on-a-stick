id: netbox-query-interface
section: netbox
title: Find an interface and its IP address in NetBox
tier: basic
floor: true  # the section's cheap floor task: CI validates it on every shared-code change
tags: [tool:netbox, iface:rest, skill:sot-query]
prompt: |
  NetBox is at {{ services.netbox.url }} (REST API under /api/, header "Authorization: Bearer {{ services.netbox.token }}").

  In NetBox, the device {{ canaries.device }} has one interface whose description is "{{ canaries.desc }}".
  Find that interface and the IPv4 address assigned to it, and write them to {{ workspace }}/answer.json:
    {"interface": "<interface name>", "address": "<address with prefix length, as NetBox shows it>"}

  Do not change anything in NetBox or on any device.
requires:
  services: [netbox]
reset_services: [netbox]
canaries:
  device: hostname
  desc: description
  addr: ipv4
setup: setup.sh
oracle: oracle.sh
checks:
  - type: json_file_matches
    name: answer.json names the interface and its address
    params:
      path: answer.json
      expected: {interface: eth2, address: "{{ canaries.addr }}/24"}
    weight: 2
  - type: netbox_unchanged
    name: nothing was changed in NetBox
    params: {allow_new: []}
  - type: no_change_outside
    name: no configuration was changed
    params: {allowed: []}
  - type: llm_judge
    name: how it went about the lookup
    params:
      artifact: transcript
      rubric: |
        Judge how the candidate went about the task, not whether the end result is right (code checks that).
        5: found the device and the interface with targeted API queries (filters such as device or description),
           took both values from NetBox's own output, and looked at the file it wrote before finishing.
        3: got to an answer, but by reading long unfiltered lists, with several failed calls on the way, or without
           ever checking what it wrote.
        1: guessed or invented values, ids, endpoints or field names instead of reading them; kept repeating
           commands that had already failed without changing approach; or changed things the task said to leave alone.
        Use 2 and 4 for attempts in between.
limits: {turns: 15}
