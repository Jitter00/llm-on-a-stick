!RANCID-CONTENT-TYPE: arista
! srl2 for Batfish, which can't read SR Linux: configs/srl/srl2.cli written as Arista EOS, with the same
! interfaces, addresses, AS and BGP neighbours, and the same policy (announce its own networks, accept all).
hostname srl2
!
interface Ethernet1
   description to frr1
   no switchport
   ip address 10.0.2.0/31
!
interface Ethernet2
   description to frr2
   no switchport
   ip address 10.0.2.2/31
!
interface Loopback0
   ip address 10.255.0.2/32
!
ip routing
!
router bgp 65002
   router-id 10.255.0.2
   maximum-paths 4
   neighbor 10.0.2.1 remote-as 65101
   neighbor 10.0.2.1 description frr1
   neighbor 10.0.2.3 remote-as 65102
   neighbor 10.0.2.3 description frr2
   redistribute connected
!
end
