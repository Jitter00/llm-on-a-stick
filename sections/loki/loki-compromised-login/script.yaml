# The task's reference steps as MCP calls: stick run loki-compromised-login --model script/<this file>
# (A script can't add up counts in a result: it knows the numbers of attempts; a model has to count them.)
steps:
  - tool: loki__list_datasources
    args: {type: loki}
    capture:
      uid: '"uid":\s*"([^"]+)"'
  - tool: loki__query_loki_logs
    args:
      datasourceUid: "{{ captured.uid }}"
      logql: 'sum by (host) (count_over_time({job="syslog"} |= "Failed password for " [15m]))'
      queryType: instant
  - tool: loki__query_loki_logs
    args:
      datasourceUid: "{{ captured.uid }}"
      logql: '{job="syslog"} |= "Failed password for "'
      limit: 100
  - tool: loki__query_loki_logs
    args:
      datasourceUid: "{{ captured.uid }}"
      logql: '{job="syslog"} |= "sessionOpened" |= "from host {{ nodes.h1.mgmt_ip }} "'
      limit: 1
    capture:
      router: '"host":\s*"([^"]+)"'
      session: 'Opened session (\d+) for user'
      user: 'for user (\S+) from host'
  - tool: loki__query_loki_logs
    args:
      datasourceUid: "{{ captured.uid }}"
      logql: '{host="{{ captured.router }}"} |= "commitSucceeded" |= "by user {{ captured.user }} session {{ captured.session }}."'
      limit: 1
  - tool: loki__query_loki_logs
    args:
      datasourceUid: "{{ captured.uid }}"
      logql: '{host="{{ captured.router }}", app="sr_cli"} |= "|{{ captured.user }}|{{ captured.session }}|" |= "description"'
      limit: 1
    capture:
      value: 'description (\S+?)["\\\s]'
  - tool: submit_answer
    args:
      answer:
        source: "{{ nodes.h1.mgmt_ip }}"
        failed_logins: {frr1: "{{ canaries.tries1 }}", frr2: "{{ canaries.tries2 }}", srl2: 2}
        router: "{{ captured.router }}"
        user: "{{ captured.user }}"
        new_value: "{{ captured.value }}"
