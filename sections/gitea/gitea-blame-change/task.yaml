id: gitea-blame-change
section: gitea
title: Find the commit that removed a BGP neighbour
tier: basic
floor: true  # the section's cheap floor task: CI validates it on every shared-code change
tags: [tool:gitea, iface:mcp, skill:git-history]
topology: none
prompt: |
  You reach a Gitea server (Git hosting) through its MCP server.

  The BGP neighbour {{ canaries.gone }} used to be configured in routers/frr2.conf of the repository
  netops/lab-configs (branch main), and no longer is. Nobody remembers taking it out. Find the commit that
  removed it and give with `submit_answer`:
    {"ticket": "<the ticket id in that commit's message>", "author": "<the name of that commit's author>"}

  Do not change anything in Gitea.
requires:
  services: [gitea]
tools:
  mcp: [gitea]
reset_services: [gitea]
canaries:
  gone: ipv4
  gone_as: asn
  other: ipv4
  other_as: asn
  ticket: description
  t_describe: description
  t_decom: description
  t_frr1: description
  t_typo: description
setup: setup.sh
oracle: oracle.sh
checks:
  - type: json_file_matches
    name: answer.json names the commit's ticket and author
    params:
      path: answer.json
      expected: {ticket: "{{ canaries.ticket }}", author: Dana Petrov}
    weight: 3
  - type: gitea_unchanged
    name: nothing was changed in Gitea
  - type: llm_judge
    name: how it searched the history
    params:
      artifact: transcript
      rubric: |
        Judge how the candidate went about the task, not whether the end result is right (code checks that).
        5: listed the commits that touched routers/frr2.conf (or the repository's history), looked at what each
           candidate commit changed until it had seen the one whose diff removes the neighbour, and took the
           ticket and the author from that commit.
        3: picked the commit from its message alone without looking at what it changed, or read only part of the
           history (the first page, another file's commits), or never submitted an answer.
        1: guessed or invented a commit, a ticket or an author instead of reading it; kept repeating calls that
           had already failed without changing approach; or changed something in Gitea.
        Use 2 and 4 for attempts in between.
limits: {turns: 20}
