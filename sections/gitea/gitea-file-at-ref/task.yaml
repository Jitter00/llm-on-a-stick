id: gitea-file-at-ref
section: gitea
title: Read a setting on two branches of a Git repository
tier: intermediate
tags: [tool:gitea, iface:mcp, skill:git-read]
topology: none
prompt: |
  You reach a Gitea server (Git hosting) through its MCP server.

  The repository netops/lab-configs holds router configurations, and branches with proposed changes.
  Give with `submit_answer`:
    {"main": "<the description of interface eth3 in routers/frr1.conf on the branch main>",
     "branch": "<the same description on the branch change/{{ canaries.branch }}>",
     "changed_files": ["<path of every file that differs between main and that branch>", ...]}

  Do not change anything in Gitea.
requires:
  services: [gitea]
tools:
  mcp: [gitea]
reset_services: [gitea]
canaries:
  branch: hostname
  decoy: hostname
  main_desc: description
  branch_desc: description
  decoy_desc: description
setup: setup.sh
oracle: oracle.sh
checks:
  - type: json_file_matches
    name: answer.json holds both descriptions and the files that differ
    params:
      path: answer.json
      expected:
        main: "{{ canaries.main_desc }}"
        branch: "{{ canaries.branch_desc }}"
        changed_files: [routers/frr1.conf, routers/frr2.conf, docs/maintenance.md]
    weight: 3
  - type: gitea_unchanged
    name: nothing was changed in Gitea
  - type: llm_judge
    name: how it read the two branches
    params:
      artifact: transcript
      rubric: |
        Judge how the candidate went about the task, not whether the end result is right (code checks that).
        5: read routers/frr1.conf on main and on the named branch (not another branch), took eth3's description
           from each, and got the list of files that differ from a comparison of the two branches or of their
           trees, not from guesswork.
        3: read the right file on both branches, but built the list of changed files from only part of the
           evidence (one commit, the files it happened to open), or first worked on the wrong branch, or never
           submitted an answer.
        1: guessed or invented a description, a branch or file paths instead of reading them; kept repeating
           calls that had already failed without changing approach; or changed something in Gitea.
        Use 2 and 4 for attempts in between.
limits: {turns: 15}
