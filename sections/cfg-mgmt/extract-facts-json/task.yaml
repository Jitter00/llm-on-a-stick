id: extract-facts-json
section: cfg-mgmt
title: Extract a router's key facts into JSON
tier: intermediate
tags: [vendor:frr, iface:cli, skill:parsing]
prompt: |
  The router frr1 runs FRRouting. You can reach it over SSH at {{ nodes.frr1.mgmt_ip }} (user admin, password admin).

  Collect the following facts about frr1 and write them to {{ workspace }}/facts.json, as one JSON object with
  exactly these keys:

    {
      "hostname":       "<the router's configured hostname>",
      "bgp_asn":        <the local BGP autonomous system number, as a number>,
      "router_id":      "<the BGP router ID>",
      "bgp_neighbors":  ["<IP address of every configured BGP neighbor>", ...],
      "ipv4_addresses": ["<every IPv4 address in frr1's running configuration, as address/prefix-length>", ...]
    }

  "ipv4_addresses" covers every interface in the running configuration, including loopbacks; the order of list
  items doesn't matter. Do not change any configuration on any device.
requires:
  devices: [frr1]
canaries:
  loopback_ip: ipv4
setup: setup.sh
oracle: oracle.sh
checks:
  - type: json_file_matches
    name: hostname, ASN, router ID and neighbors are correct
    params:
      path: facts.json
      expected:
        hostname: frr1
        bgp_asn: 65101
        router_id: 10.255.0.11
        bgp_neighbors: [10.0.1.0, 10.0.2.0]
    weight: 2
  - type: json_file_matches
    name: every IPv4 address is listed, including this run's loopback
    params:
      path: facts.json
      expected:
        ipv4_addresses: [10.0.1.1/31, 10.0.2.1/31, 10.1.1.1/24, 10.255.0.11/32, "{{ canaries.loopback_ip }}/32"]
    weight: 2
  - type: no_change_outside
    name: no configuration was changed
    params: {allowed: []}
limits: {turns: 30}
