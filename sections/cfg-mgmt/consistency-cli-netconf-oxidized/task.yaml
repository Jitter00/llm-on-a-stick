id: consistency-cli-netconf-oxidized
section: cfg-mgmt
title: Find which source of a router's configuration is out of date (CLI, NETCONF, Oxidized)
tier: advanced
tags: [vendor:srl, iface:cli, iface:netconf, tool:oxidized, skill:config-retrieval, skill:comparison]
prompt: |
  Three sources describe the configuration of router srl1 (Nokia SR Linux):
    1. its CLI, over SSH at {{ nodes.srl1.mgmt_ip }} (user admin, password NokiaSrl1!)
    2. its NETCONF server at {{ nodes.srl1.mgmt_ip }}, port 830 (same credentials), running datastore
    3. its latest backup in Oxidized, whose web interface and REST API are at {{ services.oxidized.url }}
       (for example /nodes.json and /node/fetch/<node name>)

  Compare srl1's configuration across the three sources and find out whether they agree. Do not trigger new
  Oxidized backups and do not change any configuration.

  Write your conclusion to {{ workspace }}/answer.json as one JSON object with exactly these keys:
    {
      "consistent": <true if all three sources agree, otherwise false>,
      "outdated_source": "<the one source that differs from the other two: cli, netconf or oxidized; none if they agree>",
      "interface": "<the name of the interface whose configuration differs, or null>",
      "device_description": "<that interface's description on the router right now, or null>"
    }
requires:
  devices: [srl1]
  services: [oxidized]
canaries:
  new_desc: description
setup: setup.sh
oracle: oracle.sh
checks:
  - type: json_file_matches
    name: the sources disagree, and Oxidized is the outdated one
    params:
      path: answer.json
      expected: {consistent: false, outdated_source: oxidized}
    weight: 2
  - type: json_file_matches
    name: the differing interface and its current description are identified
    params:
      path: answer.json
      expected: {interface: ethernet-1/2, device_description: "{{ canaries.new_desc }}"}
    weight: 2
  - type: no_change_outside
    name: no configuration was changed
    params: {allowed: []}
limits: {turns: 40}
