id: running-config-cli-srl
section: cfg-mgmt
title: Save an SR Linux router's full running config in flat format (CLI)
tier: basic
tags: [vendor:srl, iface:cli, skill:config-retrieval]
prompt: |
  The router srl1 runs Nokia SR Linux. You can reach it over SSH at {{ nodes.srl1.mgmt_ip }}
  (user admin, password NokiaSrl1!).

  Save srl1's complete running configuration to the file:
    {{ workspace }}/srl1.cfg

  Use SR Linux's "flat" format: one complete `set / ...` command per line, covering the whole configuration.

  Do not change any configuration on any device.
requires:
  devices: [srl1]
canaries:
  port_desc: description
setup: setup.sh
oracle: oracle.sh
checks:
  - type: file_matches_running_config
    name: srl1.cfg is srl1's complete running config (flat)
    params: {node: srl1, path: srl1.cfg, format: flat}
    weight: 3
  - type: file_contains
    name: includes this run's interface description
    params: {path: srl1.cfg, lines: ["set / interface ethernet-1/2 description {{ canaries.port_desc }}"]}
  - type: no_change_outside
    name: no configuration was changed
    params: {allowed: []}
limits: {turns: 20}
