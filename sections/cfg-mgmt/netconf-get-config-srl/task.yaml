id: netconf-get-config-srl
section: cfg-mgmt
title: Retrieve an SR Linux router's running config over NETCONF
tier: intermediate
tags: [vendor:srl, iface:netconf, skill:config-retrieval]
prompt: |
  The router srl1 (Nokia SR Linux) has a NETCONF server at {{ nodes.srl1.mgmt_ip }}, port 830
  (user admin, password NokiaSrl1!).

  Using NETCONF, retrieve srl1's complete running configuration with a <get-config> operation on the running
  datastore, and save the XML <rpc-reply> you receive to:
    {{ workspace }}/srl1-running.xml

  Do not change any configuration on any device.
requires:
  devices: [srl1]
canaries:
  port_desc: description
setup: setup.sh
oracle: oracle.sh
checks:
  - type: xml_file_xpath
    name: the reply holds srl1's live configuration
    params:
      path: srl1-running.xml
      expect:
        ".//interface[name='ethernet-1/1']/description": "{{ canaries.port_desc }}"
        ".//network-instance[name='default']/protocols/bgp/autonomous-system": "65001"
        ".//network-instance[name='default']/protocols/bgp/neighbor[peer-address='10.0.1.3']/peer-as": "65102"
    weight: 2
  - type: xml_file_xpath
    name: the reply is the complete configuration, not a part of it
    params:
      path: srl1-running.xml
      expect:
        ".//system": "*"
        ".//routing-policy": "*"
        ".//interface[name='ethernet-1/2']": "*"
  - type: no_change_outside
    name: no configuration was changed
    params: {allowed: []}
limits: {turns: 30}
