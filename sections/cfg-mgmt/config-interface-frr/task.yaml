id: config-interface-frr
section: cfg-mgmt
title: Read one interface's configuration from an FRR router
tier: basic
floor: true  # the section's cheap floor task: CI validates it on every shared-code change
tags: [vendor:frr, iface:mcp, skill:config-retrieval]
prompt: |
  You reach the lab's routers through an MCP server, which runs one CLI command per call. frr2 runs FRRouting,
  and its CLI commands are run as: vtysh -c "<command>"

  From frr2's running configuration, report what is configured on its interface eth3: the description and the
  IPv4 address with its prefix length. Submit them with submit_answer:
    {"description": "<description>", "ipv4": "<address/length>"}

  Do not change any configuration on any device.
requires:
  devices: [frr2]
tools:
  mcp: [routers]
canaries:
  host_desc: description
setup: setup.sh
oracle: oracle.sh
checks:
  - type: json_file_matches
    name: the answer holds eth3's description and address
    params:
      path: answer.json
      expected: {description: "{{ canaries.host_desc }}", ipv4: 10.1.2.1/24}
    weight: 3
  - type: no_change_outside
    name: no configuration was changed
    params: {allowed: []}
  - type: llm_judge
    name: how it read the configuration
    params:
      artifact: transcript
      rubric: |
        Judge how the candidate went about the task, not whether the end result is right (code checks that).
        5: read frr2's running configuration (all of it or the interface's part) with a working vtysh command,
           and submitted the description and address exactly as that output shows them.
        3: got the values after several wrong commands, or from operational output (interface state) instead of
           the running configuration, or never submitted an answer.
        1: submitted values its outputs do not show; kept repeating calls that had already failed without
           changing approach; or changed configuration.
        Use 2 and 4 for attempts in between.
limits: {turns: 15}
