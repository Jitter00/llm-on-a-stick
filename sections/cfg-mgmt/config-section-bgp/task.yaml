id: config-section-bgp
section: cfg-mgmt
title: Report the BGP configuration of two routers from different vendors
tier: intermediate
tags: [vendor:srl, vendor:frr, iface:mcp, skill:config-retrieval, skill:filtering]
prompt: |
  You reach the lab's routers through an MCP server, which runs one CLI command per call. srl2 runs Nokia
  SR Linux. frr1 runs FRRouting, and its CLI commands are run as: vtysh -c "<command>"

  From the running configuration of each of the two routers, report its BGP configuration in the default
  routing instance: its own AS number, and every configured neighbour with the neighbour's address, the AS
  number configured for it and its description. Submit it with submit_answer:
    {"srl2": {"asn": <number>, "neighbors": [{"address": "<address>", "peer_as": <number>, "description": "<text>"}]},
     "frr1": {"asn": <number>, "neighbors": [...]}}

  Do not change any configuration on any device.
requires:
  devices: [srl2, frr1]
tools:
  mcp: [routers]
canaries:
  srl_desc_a: description
  srl_desc_b: description
  frr_desc_a: description
  frr_desc_b: description
setup: setup.sh
oracle: oracle.sh
checks:
  - type: json_file_matches
    name: srl2's AS and both neighbours are right
    params:
      path: answer.json
      expected:
        srl2:
          asn: 65002
          neighbors:
            - {address: 10.0.2.1, peer_as: 65101, description: "{{ canaries.srl_desc_a }}"}
            - {address: 10.0.2.3, peer_as: 65102, description: "{{ canaries.srl_desc_b }}"}
    weight: 2
  - type: json_file_matches
    name: frr1's AS and both neighbours are right
    params:
      path: answer.json
      expected:
        frr1:
          asn: 65101
          neighbors:
            - {address: 10.0.1.0, peer_as: 65001, description: "{{ canaries.frr_desc_a }}"}
            - {address: 10.0.2.0, peer_as: 65002, description: "{{ canaries.frr_desc_b }}"}
    weight: 2
  - type: no_change_outside
    name: no configuration was changed
    params: {allowed: []}
limits: {turns: 20}
