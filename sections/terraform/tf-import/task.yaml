id: tf-import
section: terraform
title: Bring hand-made AWS resources under Terraform without changing them
tier: advanced
tags: [tool:terraform, iface:cli, skill:iac-import]
topology: none
prompt: |
  Terraform and its AWS provider (hashicorp/aws) are installed in your toolbox; `terraform init` needs no
  download. An AWS account is ready: the credentials, the region eu-west-1 and the API endpoint, an emulator,
  are set in the environment, so `provider "aws" {}` needs no arguments (`aws` and boto3 work too).

  Someone built a small network by hand:
    - the VPC with the Name tag {{ canaries.name }};
    - the subnet with the Name tag {{ canaries.name }}-a in it;
    - the security group named {{ canaries.name }}-web in it.

  Bring these three under Terraform in {{ workspace }}/legacy (it has a provider block already): write
  their configuration and import them, so that `terraform plan` there reports no changes. The resources
  themselves must stay exactly as they are: nothing recreated, modified or added in the account.
requires:
  services: [moto]
reset_services: [moto]
canaries:
  vpc: net16
  name: hostname
setup: setup.sh
oracle: oracle.sh
checks:
  - type: terraform_state_has
    name: Terraform manages the VPC, the subnet and the security group
    params:
      path: legacy
      types: {aws_vpc: 1, aws_subnet: 1, aws_security_group: 1}
    weight: 2
  - type: terraform_plan_clean
    name: terraform plan reports no changes
    params: {path: legacy}
    weight: 2
  - type: aws_unchanged
    name: nothing was recreated, modified or added in the AWS account
limits: {turns: 30}
