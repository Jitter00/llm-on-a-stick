id: librenms-query-port
section: librenms
title: Find a port by its description in LibreNMS
tier: basic
floor: true  # the section's cheap floor task: CI validates it on every shared-code change
tags: [tool:librenms, iface:mcp, skill:nms-query]
prompt: |
  You reach LibreNMS through its MCP server.

  One port on one of the devices that LibreNMS monitors has the description "{{ canaries.desc }}".
  Find it in LibreNMS and give with `submit_answer`:
    {"device": "<the device's system name (sysName)>", "port": "<the port's name (ifName)>", "ifindex": <its ifIndex>}

  Do not change anything in LibreNMS or on any device.
requires:
  devices: [srl1, srl2, frr1]
  services: [librenms]
tools:
  mcp: [librenms]
reset_services: [librenms]
canaries:
  desc: description
  other: description
  n1: hostname
  n2: hostname
setup: setup.sh
oracle: oracle.sh
checks:
  - type: json_file_matches
    name: answer.json names the device, the port and its ifIndex
    params:
      path: answer.json
      expected: {device: "{{ canaries.n2 }}", port: ethernet-1/7, ifindex: 32780}
    weight: 2
  - type: librenms_unchanged
    name: nothing was changed in LibreNMS
  - type: no_change_outside
    name: no configuration was changed
    params: {allowed: []}
  - type: llm_judge
    name: how it searched for the port
    params:
      artifact: transcript
      rubric: |
        Judge how the candidate went about the task, not whether the end result is right (code checks that).
        5: searched LibreNMS's ports for the description (a search or filter, or a complete listing with the
           needed fields), then read the port's name and ifIndex and its device's sysName from LibreNMS, and
           submitted only values it had seen.
        3: got to an answer by going through devices and long port lists one by one with several failed calls,
           or submitted a device identifier other than the sysName it could have read, or never submitted an
           answer.
        1: guessed or invented a device, a port name or an ifIndex instead of reading it; kept repeating calls
           that had already failed without changing approach; or changed something in LibreNMS.
        Use 2 and 4 for attempts in between.
limits: {turns: 15}
