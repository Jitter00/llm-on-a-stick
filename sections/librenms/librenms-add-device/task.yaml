id: librenms-add-device
section: librenms
title: Add a router to LibreNMS over SNMP
tier: intermediate
tags: [tool:librenms, vendor:srl, iface:rest, skill:nms-onboarding]
prompt: |
  LibreNMS is at {{ services.librenms.url }} (REST API under /api/v0/, header "X-Auth-Token: {{ services.librenms.token }}").

  Add the router srl1 to LibreNMS, by its management address {{ nodes.srl1.mgmt_ip }}, so that LibreNMS
  monitors it over SNMP version 2c. Its read-only community is {{ canaries.community }}.

  LibreNMS must really reach it: a device that is listed but can't be polled doesn't count. Do not change
  the other devices in LibreNMS, or any router.
requires:
  devices: [srl1, frr1]
  services: [librenms]
reset_services: [librenms]
canaries:
  community: description
setup: setup.sh
oracle: oracle.sh
checks:
  - type: librenms_device
    name: LibreNMS monitors srl1 and reaches it over SNMP
    params:
      hostname: "{{ nodes.srl1.mgmt_ip }}"
      expect: {status: 1, os: srlinux, snmpver: v2c, community: "{{ canaries.community }}"}
    weight: 3
  - type: librenms_unchanged
    name: nothing else was changed in LibreNMS
    params: {allow_new: ["devices:{{ nodes.srl1.mgmt_ip }}"]}
  - type: no_change_outside
    name: no router was changed
    params: {allowed: []}
limits: {turns: 15}
