id: librenms-netbox-sync
section: librenms
title: Make LibreNMS monitor the devices NetBox lists as active
tier: advanced
tags: [tool:librenms, tool:netbox, iface:mcp, skill:sot-driven-change]
prompt: |
  You reach LibreNMS and NetBox through their MCP servers.

  NetBox is the source of truth for what must be monitored: every device whose status in NetBox is active,
  and no other. Bring LibreNMS in line with it:
    - add each active device that LibreNMS doesn't monitor yet, by its primary IPv4 address in NetBox, over
      SNMP version 2c with the community stick-ro;
    - devices with another status must not be in LibreNMS;
    - leave devices that are already monitored correctly as they are.

  Do not change anything in NetBox or on any router.
requires:
  devices: [srl1, srl2, frr1, frr2]
  services: [librenms, netbox]
tools:
  mcp: [librenms, netbox]
reset_services: [librenms, netbox]
canaries:
  n1: hostname
  n2: hostname
  n3: hostname
  n4: hostname
setup: setup.sh
oracle: oracle.sh
checks:
  - type: librenms_device
    name: the first active device was added and is reached
    params: {hostname: "{{ nodes.srl1.mgmt_ip }}", expect: {status: 1, os: srlinux}}
    weight: 2
  - type: librenms_device
    name: the second active device was added and is reached
    params: {hostname: "{{ nodes.frr1.mgmt_ip }}", expect: {status: 1}}
    weight: 2
  - type: librenms_absent
    name: the planned device is not monitored
    params: {hostname: "{{ nodes.srl2.mgmt_ip }}"}
  - type: librenms_unchanged
    name: the device already monitored was left alone
    params: {allow_new: ["devices:{{ nodes.srl1.mgmt_ip }}", "devices:{{ nodes.frr1.mgmt_ip }}"]}
  - type: netbox_unchanged
    name: nothing was changed in NetBox
    params: {allow_new: []}
  - type: no_change_outside
    name: no router was changed
    params: {allowed: []}
  - type: llm_judge
    name: how it brought LibreNMS in line with NetBox
    params:
      artifact: transcript
      rubric: |
        Judge how the candidate went about the task, not whether the end result is right (code checks that).
        5: read all devices from NetBox with status and primary IPv4 address, read the devices LibreNMS
           monitors, compared the two, added only the missing active ones by the address NetBox gives with the
           SNMP settings asked for, removed only those with another status, left the rest, and confirmed.
        3: did the additions but not the removal (or the other way round), or took addresses or statuses from
           part of NetBox's list (first page only), or re-added or edited a device that was already right, or
           never confirmed the result.
        1: added or removed devices without reading NetBox, used addresses or names NetBox does not give,
           changed NetBox, or invented ids; or kept repeating calls that had already failed without changing
           approach.
        Use 2 and 4 for attempts in between.
limits: {turns: 25}
