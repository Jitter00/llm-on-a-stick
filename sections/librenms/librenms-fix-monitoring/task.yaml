id: librenms-fix-monitoring
section: librenms
title: Get a router that LibreNMS reports down monitored again
tier: intermediate
tags: [tool:librenms, iface:mcp, skill:nms-troubleshooting]
prompt: |
  You reach LibreNMS through its MCP server.

  LibreNMS has reported one of its routers as down since the network team changed that router's SNMP
  community to {{ canaries.community }}. The router itself works. Find out which router it is and make
  LibreNMS monitor it again.

  Keep the router's entry in LibreNMS (its history must not be lost: don't delete it and add it again).
  Do not change the other devices in LibreNMS, or any router.
requires:
  devices: [srl1, srl2, frr1, frr2]
  services: [librenms]
tools:
  mcp: [librenms]
reset_services: [librenms]
canaries:
  community: description
setup: setup.sh
oracle: oracle.sh
checks:
  - type: librenms_device
    name: LibreNMS reaches the router again, with the new community
    params:
      hostname: "{{ nodes.srl2.mgmt_ip }}"
      expect: {status: 1, community: "{{ canaries.community }}"}
    weight: 3
  - type: librenms_unchanged
    name: the entry was kept and no other device was changed
    params: {allow_changed: ["devices:{{ nodes.srl2.mgmt_ip }}"]}
  - type: no_change_outside
    name: no router was changed
    params: {allowed: []}
  - type: llm_judge
    name: how it found and repaired the device
    params:
      artifact: transcript
      rubric: |
        Judge how the candidate went about the task, not whether the end result is right (code checks that).
        5: listed the devices to find the one that is down, read its SNMP settings, changed only the community
           on the existing entry, then had LibreNMS check the device again (a rediscovery or poll, or reading
           its status) and confirmed it is up.
        3: updated the right device, but only after trying several fields or calls that failed, or never
           confirmed that LibreNMS reaches it again.
        1: deleted the device and added it again, changed other devices, changed settings without reading which
           device is down, or invented ids or field names; or kept repeating calls that had already failed
           without changing approach.
        Use 2 and 4 for attempts in between.
limits: {turns: 20}
