id: aws-query-instance
section: aws
title: Find an EC2 instance's address, subnet and security group
tier: basic
floor: true  # the section's cheap floor task: CI validates it on every shared-code change
tags: [tool:aws, iface:mcp, skill:cloud-query]
topology: none
prompt: |
  You reach an AWS account (region eu-west-1, an emulator) through the AWS API MCP server, which runs one
  AWS CLI command per call.

  One EC2 instance has the Name tag {{ canaries.host }}. Find its private IPv4 address, the CIDR block of the
  subnet it is in, and the name of its security group, and give them with `submit_answer`:
    {"private_ip": "<address>", "subnet_cidr": "<CIDR block>", "security_group": "<group name>"}

  Do not change anything in the account.
requires:
  services: [moto]
tools:
  mcp: [moto]
reset_services: [moto]
canaries:
  vpc: net16
  host: hostname
  other: hostname
  sg: hostname
setup: setup.sh
oracle: oracle.sh
checks:
  - type: json_file_matches
    name: answer.json has the instance's address, subnet and security group
    params:
      path: answer.json
      expected:
        private_ip: "{{ canaries.vpc }}.1.10"
        subnet_cidr: "{{ canaries.vpc }}.1.0/24"
        security_group: "{{ canaries.sg }}"
    weight: 2
  - type: aws_unchanged
    name: nothing was changed in the AWS account
  - type: llm_judge
    name: how it looked the instance up
    params:
      artifact: transcript
      rubric: |
        Judge how the candidate went about the task, not whether the end result is right (code checks that).
        5: found the instance by its Name tag with a filter, then read the subnet's CIDR block and the security
           group's name from the account by the ids the instance gave, and submitted only values it had seen.
        3: got to an answer by listing everything unfiltered and picking through it, with several failed
           commands on the way, or took a value from the instance's output without looking up what it refers to,
           or never submitted an answer.
        1: guessed or invented an address, a CIDR block, a group name or an id instead of reading it; kept
           repeating calls that had already failed without changing approach; or changed something in the
           account.
        Use 2 and 4 for attempts in between.
limits: {turns: 15}
