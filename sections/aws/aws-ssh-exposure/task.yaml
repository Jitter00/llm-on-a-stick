id: aws-ssh-exposure
section: aws
title: Report every instance whose security groups open SSH to the internet
tier: intermediate
tags: [tool:aws-cli, iface:rest, skill:cloud-security]
topology: none
prompt: |
  An AWS account is ready in your toolbox: `aws` and boto3 work as they are (the credentials, the region
  eu-west-1 and the API endpoint, an emulator, are set in the environment).

  Security audit: which EC2 instances in the account accept SSH (TCP port 22) from the whole internet,
  judging by the inbound rules of their security groups? The whole internet is a source of 0.0.0.0/0 or
  ::/0. Look at every instance, stopped ones included (they are exposed again as soon as they start).

  Write the Name tags of the exposed instances to {{ workspace }}/answer.json:
    {"exposed": ["<name>", ...]}

  Do not change anything in the account.
requires:
  services: [moto]
reset_services: [moto]
canaries:
  plain: hostname
  range: hostname
  allproto: hostname
  ipv6: hostname
  internal: hostname
  otherport: hostname
  viagroup: hostname
  egress: hostname
setup: setup.sh
oracle: oracle.sh
checks:
  - type: json_file_matches
    name: answer.json lists exactly the four exposed instances
    params:
      path: answer.json
      expected:
        exposed:
          - "{{ canaries.plain }}"
          - "{{ canaries.range }}"
          - "{{ canaries.allproto }}"
          - "{{ canaries.ipv6 }}"
    weight: 3
  - type: aws_unchanged
    name: nothing was changed in the AWS account
limits: {turns: 20}
