id: aws-sg-tighten
section: aws
title: Restrict SSH on a security group that is in use
tier: intermediate
tags: [tool:aws-cli, iface:rest, skill:cloud-security]
topology: none
prompt: |
  An AWS account is ready in your toolbox: `aws` and boto3 work as they are (the credentials, the region
  eu-west-1 and the API endpoint, an emulator, are set in the environment).

  The EC2 instance with the Name tag {{ canaries.host }} accepts SSH (TCP port 22) from anywhere on the
  internet. Change that: SSH to it must be allowed from {{ canaries.office }}.0/24 only.

  Edit the rules of the security group that opens it; do not delete or replace the group (other things
  refer to it by its id). Keep every other rule, security group and resource as it is.
requires:
  services: [moto]
reset_services: [moto]
canaries:
  host: hostname
  sg: hostname
  office: net24
setup: setup.sh
oracle: oracle.sh
checks:
  - type: aws_query
    name: SSH is allowed from the office network only
    params:
      command: ec2 describe-security-groups --filters Name=group-name,Values={{ canaries.sg }}
      query: SecurityGroups[].IpPermissions[?FromPort<=`22` && ToPort>=`22`][].IpRanges[].CidrIp
      expect: ["{{ canaries.office }}.0/24"]
    weight: 2
  - type: aws_query
    name: the group's other rules are still there
    params:
      command: ec2 describe-security-groups --filters Name=group-name,Values={{ canaries.sg }}
      query: SecurityGroups[].IpPermissions[?FromPort!=`22`][].{port:FromPort,from:IpRanges[].CidrIp}
      expect:
        - {port: 443, from: [0.0.0.0/0]}
        - {port: 5432, from: [10.0.0.0/8]}
  - type: aws_query
    name: no rule of the group allows every protocol
    params:
      command: ec2 describe-security-groups --filters Name=group-name,Values={{ canaries.sg }}
      query: SecurityGroups[].IpPermissions[?IpProtocol=='-1'][]
      count: 0
  - type: aws_unchanged
    name: the group was kept and nothing else was changed
    params:
      allow_changed: ["ec2/security-groups:{{ canaries.sg }}"]
limits: {turns: 20}
