id: aws-iam-role
section: aws
title: Create a least-privilege IAM role for an EC2 application
tier: advanced
tags: [tool:aws-cli, iface:rest, skill:cloud-iam]
topology: none
prompt: |
  An AWS account is ready in your toolbox: `aws` and boto3 work as they are (the credentials, the region
  eu-west-1 and the API endpoint, an emulator, are set in the environment).

  An application on EC2 instances must read the objects under the prefix reports/ in the S3 bucket
  {{ canaries.bucket }}, and nothing else. Create:
    - an IAM role {{ canaries.role }} that EC2 instances can assume (and nothing else can);
    - on that role, one inline policy named s3-read that allows exactly s3:GetObject on the objects under
      reports/ in that bucket, and s3:ListBucket on the bucket. No wildcard actions, no other resources, no
      managed policies;
    - an instance profile {{ canaries.role }} that contains the role.

  Do not change anything else in the account.
requires:
  services: [moto]
reset_services: [moto]
canaries:
  bucket: hostname
  role: hostname
  other: hostname
setup: setup.sh
oracle: oracle.sh
checks:
  - type: aws_policy_grants
    name: only EC2 can assume the role
    params:
      command: iam get-role --role-name {{ canaries.role }}
      query: Role.AssumeRolePolicyDocument
      grants: [[Allow, "sts:AssumeRole", ec2.amazonaws.com]]
    weight: 2
  - type: aws_policy_grants
    name: the inline policy s3-read grants exactly the two permissions
    params:
      command: iam get-role-policy --role-name {{ canaries.role }} --policy-name s3-read
      query: PolicyDocument
      grants:
        - [Allow, "s3:GetObject", "arn:aws:s3:::{{ canaries.bucket }}/reports/*"]
        - [Allow, "s3:ListBucket", "arn:aws:s3:::{{ canaries.bucket }}"]
    weight: 2
  - type: aws_query
    name: the role has no other inline policy
    params:
      command: iam list-role-policies --role-name {{ canaries.role }}
      query: PolicyNames
      expect: [s3-read]
  - type: aws_query
    name: the role has no managed policy
    params:
      command: iam list-attached-role-policies --role-name {{ canaries.role }}
      query: AttachedPolicies
      count: 0
  - type: aws_query
    name: the instance profile contains the role
    params:
      command: iam get-instance-profile --instance-profile-name {{ canaries.role }}
      query: InstanceProfile.Roles[].RoleName
      expect: ["{{ canaries.role }}"]
  - type: aws_unchanged
    name: nothing else was changed in the AWS account
    params:
      allow_new: ["iam/roles:{{ canaries.role }}", "iam/instance-profiles:{{ canaries.role }}"]
limits: {turns: 20}
