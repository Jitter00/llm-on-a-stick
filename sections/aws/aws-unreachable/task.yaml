id: aws-unreachable
section: aws
title: Find and fix everything that keeps a web server unreachable
tier: advanced
tags: [tool:aws, iface:mcp, skill:cloud-troubleshooting]
topology: none
prompt: |
  You reach an AWS account (region eu-west-1, an emulator) through the AWS API MCP server, which runs one
  AWS CLI command per call.

  The web server {{ canaries.host }} (an EC2 instance with that Name tag) must answer HTTPS (TCP 443) for
  clients anywhere on the internet. It doesn't: their connections time out. The server itself is healthy
  and listens on 443, so the cause is in the account's network configuration, and there may be more than
  one. Another web server in the same VPC, {{ canaries.other }}, works.

  The emulator carries no traffic, so you cannot test a connection: work from the configuration. Find
  everything that stops HTTPS from the internet reaching {{ canaries.host }} and fix it. Change as little
  as possible: open nothing but HTTPS, and leave {{ canaries.other }} and the rest of the account as they
  are.
requires:
  services: [moto]
tools:
  mcp: [moto]
reset_services: [moto]
canaries:
  vpc: net16
  host: hostname
  other: hostname
  name: hostname
setup: setup.sh
oracle: oracle.sh
checks:
  - type: aws_reachable
    name: HTTPS from the internet reaches the web server
    params: {instance: "{{ canaries.host }}", port: 443}
    weight: 4
  - type: aws_reachable
    name: SSH from the internet still does not reach it
    params: {instance: "{{ canaries.host }}", port: 22, reachable: false}
  - type: aws_reachable
    name: the other web server still works
    params: {instance: "{{ canaries.other }}", port: 443}
  - type: aws_query
    name: the VPC's main route table (the database subnet's) got no default route
    params:
      command: >-
        ec2 describe-route-tables --filters Name=association.main,Values=true Name=vpc-id,Values=$(aws ec2
        describe-vpcs --filters Name=tag:Name,Values={{ canaries.name }} --query 'Vpcs[0].VpcId' --output text)
      query: RouteTables[].Routes[?DestinationCidrBlock=='0.0.0.0/0'][]
      count: 0
  - type: aws_unchanged
    name: nothing else was changed in the AWS account
    params:
      allow_new: [ec2/addresses, ec2/route-tables, ec2/network-acls, ec2/security-groups]
      allow_changed:
        - "ec2/instances:{{ canaries.host }}"
        - "ec2/subnets:{{ canaries.name }}-web"
        - "ec2/security-groups:{{ canaries.host }}"
        - ec2/addresses
        - ec2/route-tables
        - ec2/network-acls
limits: {turns: 30}
