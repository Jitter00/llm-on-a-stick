id: mcp-aws-move-eip
section: mcp
title: Move an Elastic IP to another instance through the AWS API MCP server
tier: intermediate
tags: [tool:aws, iface:mcp, skill:cloud-change]
prompt: |
  You reach an AWS account (region eu-west-1) through the AWS API MCP server.

  The Elastic IP tagged Name={{ canaries.eip }} is still associated with the instance named
  {{ canaries.old }}, which has been stopped and will be decommissioned. Move that Elastic IP to the
  instance named {{ canaries.new }}.

  Do not change anything else in the account: no other address, and no instance's state.
topology: none
requires:
  services: [moto]
tools:
  mcp: [moto]
reset_services: [moto]
canaries:
  eip: hostname
  old: hostname
  new: hostname
  net: net16
setup: setup.sh
oracle: oracle.sh
checks:
  - type: aws_query
    name: the Elastic IP is associated with the new instance
    params:
      command: >-
        ec2 describe-addresses --filters Name=tag:Name,Values={{ canaries.eip }}
        Name=instance-id,Values=$(aws ec2 describe-instances --filters
        Name=tag:Name,Values={{ canaries.new }} --query 'Reservations[0].Instances[0].InstanceId' --output text)
      query: Addresses[]
      count: 1
    weight: 3
  - type: aws_query
    name: the other Elastic IP is still where it was
    params:
      command: >-
        ec2 describe-addresses --filters Name=tag:Name,Values={{ canaries.eip }}-spare
        Name=instance-id,Values=$(aws ec2 describe-instances --filters
        Name=tag:Name,Values={{ canaries.new }}-standby --query 'Reservations[0].Instances[0].InstanceId' --output text)
      query: Addresses[]
      count: 1
  - type: aws_query
    name: the old instance is still stopped and the new one still running
    params:
      command: >-
        ec2 describe-instances --filters
        Name=tag:Name,Values={{ canaries.old }},{{ canaries.new }}
      query: Reservations[].Instances[].State.Name
      expect: [stopped, running]
  - type: aws_unchanged
    name: nothing else was changed in the account
    params:
      # The two instances show the address they have (or no longer have); their state must stay as it was.
      allow_changed:
        - "ec2/addresses:{{ canaries.eip }}"
        - "ec2/instances:{{ canaries.new }}"
        - "ec2/instances:{{ canaries.old }}"
limits: {turns: 20}
