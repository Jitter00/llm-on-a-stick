# The task's reference steps as MCP calls: stick run mcp-librenms-ip-owner --model script/<this file>
# (A script can't collect a list from a result: it knows the port's other addresses; a model has to find them.)
steps:
  - tool: librenms__routing_ip_addresses
    args: {}
    capture:
      port: '"ipv4_address":\s*"{{ canaries.addr }}"[^{}]*?"port_id":\s*(\d+)'
  - tool: librenms__port_get
    args: {port_id: "{{ captured.port }}"}
    capture:
      device: '"device_id":\s*(\d+)'
      name: '"ifName":\s*"([^"]+)"'
  - tool: librenms__device_get
    args: {hostname: "{{ captured.device }}"}
    capture:
      sysname: '"sysName":\s*"([^"]+)"'
  - tool: submit_answer
    args:
      answer:
        device: "{{ captured.sysname }}"
        port: "{{ captured.name }}"
        addresses: [10.1.2.1, "{{ canaries.addr }}", "{{ canaries.second }}"]
