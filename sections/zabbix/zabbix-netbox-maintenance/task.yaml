id: zabbix-netbox-maintenance
section: zabbix
title: Put a NetBox tenant's devices in maintenance in Zabbix
tier: advanced
tags: [tool:zabbix, tool:netbox, iface:mcp, skill:nms-maintenance, skill:cross-tool]
prompt: |
  You reach NetBox and Zabbix through their MCP servers.

  The devices of the NetBox tenant {{ canaries.tenant }} are being upgraded now. Zabbix monitors the same
  devices under other names: a Zabbix host is the NetBox device whose primary IPv4 address is the address of
  the host's interface.

  Create one maintenance period in Zabbix, named {{ canaries.window }}, that starts now and lasts 2 hours,
  with data collection, for exactly the Zabbix hosts of that tenant's devices.

  Create that one maintenance only. Do not change anything else in Zabbix (hosts, host groups).
topology: none
requires:
  services: [netbox, zabbix]
tools:
  mcp: [netbox, zabbix]
reset_services: [netbox, zabbix]
canaries:
  tenant: hostname
  window: hostname
  net: net24
  h1: hostname
  h2: hostname
  h3: hostname
  h4: hostname
  h5: hostname
setup: setup.sh
oracle: oracle.sh
checks:
  - type: zabbix_maintenance
    name: the tenant's two hosts, and only they, are in a 2-hour maintenance with data collection
    params:
      name: "{{ canaries.window }}"
      hosts: ["{{ canaries.h1 }}", "{{ canaries.h2 }}"]
      duration_s: 7200
      data_collection: true
    weight: 3
  - type: zabbix_unchanged
    name: nothing else was changed in Zabbix
    params: {allow_new: ["maintenances:{{ canaries.window }}"]}
  - type: netbox_unchanged
    name: nothing was changed in NetBox
    params: {allow_new: []}
  - type: llm_judge
    name: how it matched the devices and created the maintenance
    params:
      artifact: transcript
      rubric: |
        Judge how the candidate went about the task, not whether the end result is right (code checks that).
        5: found the tenant in NetBox and read all of its devices with their primary IPv4 addresses, found the
           Zabbix host for each by the address of the host's interface (not by name), created one maintenance
           with the name, start, length and type asked for and exactly those hosts, and read it back.
        3: created the maintenance, but matched hosts on part of the evidence (names, an incomplete device or
           host list), or needed several attempts at the times or fields, or never read back what it created.
        1: chose hosts without reading NetBox, invented host ids or timestamps, created more than one
           maintenance, added whole host groups, or changed hosts; or kept repeating calls that had already
           failed without changing approach.
        Use 2 and 4 for attempts in between.
limits: {turns: 30}
