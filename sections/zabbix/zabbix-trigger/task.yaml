id: zabbix-trigger
section: zabbix
title: Create a Zabbix trigger for the right port
tier: advanced
tags: [tool:zabbix, vendor:srl, iface:json-rpc, skill:nms-alerting]
prompt: |
  Zabbix is at {{ services.zabbix.url }} (JSON-RPC API: POST to /api_jsonrpc.php, header
  "Authorization: Bearer {{ services.zabbix.token }}").

  Zabbix monitors the routers srl1 and srl2 over SNMP. A port with the description "{{ canaries.desc }}"
  is operationally down on one of them (a port with the same description is up on the other).

  Create one trigger in Zabbix, named {{ canaries.trigger }}, with severity High, on the router where that
  port is down. It must be in problem state for as long as that port's operational status is down, and
  only then.

  The trigger is checked by what it does: after the next poll there must be one open problem from it.
  Create one trigger only, and do not change anything else in Zabbix or on any router.
requires:
  devices: [srl1, srl2]
  services: [zabbix]
reset_services: [zabbix]
canaries:
  trigger: hostname
  desc: description
setup: setup.sh
oracle: oracle.sh
checks:
  - type: zabbix_problem
    name: the trigger is on srl1 and has raised one problem
    params:
      trigger: "{{ canaries.trigger }}"
      hosts: [srl1]
      severity: 4
    weight: 3
  - type: zabbix_unchanged
    name: nothing else was changed in Zabbix
    params: {allow_new: ["triggers:{{ canaries.trigger }}"]}
  - type: no_change_outside
    name: no router was changed
    params: {allowed: []}
limits: {turns: 25}
