id: zabbix-add-host
section: zabbix
title: Add a router to Zabbix over SNMP
tier: intermediate
tags: [tool:zabbix, vendor:srl, iface:mcp, skill:nms-onboarding]
prompt: |
  You reach Zabbix through its MCP server.

  Add the router srl1 to Zabbix so that Zabbix monitors it over SNMP version 2c:
    - host name: {{ canaries.name }}
    - SNMP interface: its management address {{ nodes.srl1.mgmt_ip }}, port 161, community {{ canaries.community }}.
      A host's SNMPv2c interface looks like this:
      {"type": 2, "main": 1, "useip": 1, "ip": "<address>", "dns": "", "port": "161",
       "details": {"version": 2, "community": "<community>"}}
    - host group: Routers (it exists)
    - template: Network Generic Device by SNMP (it exists)

  Zabbix must really reach it: a host that is listed but can't be polled over SNMP doesn't count. Do not
  change the other hosts in Zabbix, or any router.
requires:
  devices: [srl1, frr1]
  services: [zabbix]
tools:
  mcp: [zabbix]
reset_services: [zabbix]
canaries:
  name: hostname
  community: description
setup: setup.sh
oracle: oracle.sh
checks:
  - type: zabbix_host
    name: Zabbix monitors srl1 and reaches it over SNMP
    params:
      ip: "{{ nodes.srl1.mgmt_ip }}"
      expect:
        host: "{{ canaries.name }}"
        status: 0
        available: 1
        snmp_version: 2
        community: "{{ canaries.community }}"
        groups: [Routers]
        templates: [Network Generic Device by SNMP]
    weight: 3
  - type: zabbix_unchanged
    name: nothing else was changed in Zabbix
    params: {allow_new: ["hosts:{{ canaries.name }}"]}
  - type: no_change_outside
    name: no router was changed
    params: {allowed: []}
  - type: llm_judge
    name: how it added the host
    params:
      artifact: transcript
      rubric: |
        Judge how the candidate went about the task, not whether the end result is right (code checks that).
        5: looked up the ids of the host group and the template by their names, created the host with the name,
           the SNMP interface, the group and the template as asked, then read the host back and waited for or
           checked that Zabbix reaches it over SNMP.
        3: created the host, but only after failed attempts with wrong fields, or left something to repair
           afterwards (a missing template or group), or never checked that Zabbix reaches the host.
        1: invented group or template ids, created several hosts or left failed ones behind, changed other
           hosts; or kept repeating calls that had already failed without changing approach.
        Use 2 and 4 for attempts in between.
limits: {turns: 20}
