id: zabbix-query-host
section: zabbix
title: Find a host by its tag in Zabbix
tier: basic
floor: true  # the section's cheap floor task: CI validates it on every shared-code change
tags: [tool:zabbix, iface:mcp, skill:nms-query]
prompt: |
  You reach Zabbix through its MCP server.

  One of the hosts in Zabbix has the tag "circuit" with the value "{{ canaries.circuit }}". Find it and
  give with `submit_answer`:
    {"host": "<the host's name in Zabbix>", "ip": "<the IP address of its SNMP interface>"}

  Do not change anything in Zabbix or on any device.
requires:
  devices: [srl1, srl2, frr1]
  services: [zabbix]
tools:
  mcp: [zabbix]
reset_services: [zabbix]
canaries:
  circuit: description
  other: description
  n1: hostname
  n2: hostname
  n3: hostname
setup: setup.sh
oracle: oracle.sh
checks:
  - type: json_file_matches
    name: answer.json names the host and its address
    params:
      path: answer.json
      expected: {host: "{{ canaries.n2 }}", ip: "{{ nodes.srl2.mgmt_ip }}"}
    weight: 2
  - type: zabbix_unchanged
    name: nothing was changed in Zabbix
  - type: no_change_outside
    name: no configuration was changed
    params: {allowed: []}
  - type: llm_judge
    name: how it searched for the host
    params:
      artifact: transcript
      rubric: |
        Judge how the candidate went about the task, not whether the end result is right (code checks that).
        5: searched Zabbix's hosts by the tag and its value (a tag filter, or a host listing that includes
           tags), read the host's name and its SNMP interface's address from Zabbix, and submitted only values
           it had seen.
        3: got to an answer by reading long unfiltered listings or after several failed calls, or picked a host
           whose tag value merely looks like the wanted one without comparing it, or took an address without
           checking it is the SNMP interface's, or never submitted an answer.
        1: guessed or invented a host name, an address or an id instead of reading it; kept repeating calls that
           had already failed without changing approach; or changed something in Zabbix.
        Use 2 and 4 for attempts in between.
limits: {turns: 15}
