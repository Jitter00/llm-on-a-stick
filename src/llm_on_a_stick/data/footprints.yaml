# RAM estimates (MiB) used by `stick doctor` and, later, the scheduler.
# `measured: true` values come from cgroup memory.current at idle, plus headroom.
# `measured: false` values are still guesses; replace them as each service is brought up.

images:
  srlinux:
    image: ghcr.io/nokia/srlinux:26.7.2
    ram_mb: 2048          # measured 1870 MiB (cgroup memory.current, ixr-d2l, idle, 2026-11-06)
    arch: [amd64, arm64]
    measured: true
  stick-frr:
    image: stick-frr:dev
    ram_mb: 64            # measured 31 MiB (bgpd + zebra + snmpd + sshd + lldpd, idle)
    arch: [amd64, arm64]
    measured: true
  multitool:
    image: ghcr.io/hellt/network-multitool
    ram_mb: 16            # measured 1 MiB idle; iperf3/tshark need more while running
    arch: [amd64, arm64]
    measured: true

topologies:
  base:
    nodes: {srlinux: 2, stick-frr: 2, multitool: 2}

services:
  netbox: {ram_mb: 1664, measured: true}    # 1453 MiB: netbox 1046 + worker 257 + postgres 146 + valkey 4
  nautobot: {ram_mb: 1536, measured: true}  # 1273 MiB after API use: nautobot 867 + postgres 401 + valkey 5 (no worker)
  librenms: {ram_mb: 1024, measured: true}  # 832 MiB with 3 devices: dispatcher 426 + web 212 + mariadb 189 + valkey 5
  zabbix: {ram_mb: 1536, measured: true}  # 1.25 GiB with 4 hosts: mariadb 1140 (mostly cache) + web 53 + server 47
  oxidized: {ram_mb: 96, measured: true}     # 47 MiB idle, 4 devices
  moto: {ram_mb: 256, measured: true}        # 178 MiB after EC2, IAM and S3 use (one container, in memory)
  batfish: {ram_mb: 2048, measured: false}
  suzieq: {ram_mb: 512, measured: false}
  gitea: {ram_mb: 256, measured: false}
  telemetry: {ram_mb: 512, measured: false}  # gNMIc + Prometheus
  loki: {ram_mb: 448, measured: true}  # 358 MiB with 4 routers logging: grafana 267 + loki 47 + alloy 44
  ddi: {ram_mb: 384, measured: false}        # PowerDNS + Kea
